
# 邮箱发送验证码测试数据
test_email_send_code_bind:
  request:
    method: POST
    url: /api/user/v1/user/emailSendCode
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      type: "0"  # 0:邮箱绑定
      email: "test_{random_str}@example.com"
  expected:
    status_code: 200
    json:
      code: 0
      message: "发送成功"

test_email_send_code_reset_password:
  request:
    method: POST
    url: /api/user/v1/user/emailSendCode
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      type: "1"  # 1:邮箱重置密码
      email: "test_{random_str}@example.com"
  expected:
    status_code: 200
    json:
      code: 0
      message: "发送成功"

test_email_send_code_unbind:
  request:
    method: POST
    url: /api/user/v1/user/emailSendCode
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      type: "2"  # 2:邮箱解绑定
      email: "test_{random_str}@example.com"
  expected:
    status_code: 200
    json:
      code: 0
      message: "发送成功"

test_email_send_code_invalid_type:
  request:
    method: POST
    url: /api/user/v1/user/emailSendCode
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      type: "3"  # 无效的type值
      email: "test_{random_str}@example.com"
  expected:
    status_code: 400
    json:
      code: 1001
      message: "~contains:参数错误"

test_email_send_code_invalid_email:
  request:
    method: POST
    url: /api/user/v1/user/emailSendCode
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      type: "0"
      email: "invalid_email"
  expected:
    status_code: 400
    json:
      code: 1001
      message: "~contains:邮箱格式错误" 