version: '3'

services:
  report-server:
    build: .
    container_name: test-report-server
    ports:
      - "7987:7987"
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: always
    environment:
      - DOCKER_ENV=true
      # 如果您有固定的公网IP或域名，可以在这里设置
      # 留空将自动检测当前局域网IP地址
      # - REPORT_SERVER_HOST=192.168.0.105
      # 报告清理配置
      - REPORT_RETENTION_DAYS=30  # 报告保留天数
    networks:
      - report-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 7987)); s.close()"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  report-network:
    driver: bridge 