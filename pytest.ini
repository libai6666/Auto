[pytest]
# 测试用例路径
testpaths = testcases

# 测试用例命名规范
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts = -v --html=reports/report.html

# 日志配置
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 环境变量
env = 
    TEST_ENV=test

# 标记
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    api: API测试用例
    high: 高优先级
    medium: 中优先级
    low: 低优先级 